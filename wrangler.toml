# Cloudflare Workers configuration.
#
# This project deploys with `npx wrangler deploy` (Workers Builds), so the
# built site is uploaded as static assets. There is no Worker script — the
# `[assets]` block alone is a valid assets-only Worker.
#
# `name` MUST match the project name in the Cloudflare dashboard.
name = "elithullendotcom"

compatibility_date = "2026-07-19"

[assets]
# Where Eleventy writes the built site.
directory = "./_site"
